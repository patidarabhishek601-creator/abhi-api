version: '3.8'
services:


  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: quickdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

volumes:
  pg_data: